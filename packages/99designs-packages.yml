summary: >-
  99designs publishes NO client library for the current partner API
  (https://api.99designs.com/resources/v1). The only first-party API client packages
  on any registry are the 99designs Tasks API clients, both last released in July 2015
  for an API surface that no longer resolves (tasks.99designs.com does not exist in
  DNS and github.com/99designs/tasks-api-ruby returns 404). The 99designs GitHub
  organization is active and publishes widely used open-source infrastructure
  libraries (gqlgen, aws-vault, keyring, http-signatures-*), but none of them are
  clients for the 99designs API — they are recorded below as first-party open source
  with api_client false so they are never mistaken for an SDK.
