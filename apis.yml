name: 99designs
description: >-
  99designs by Vista is a global creative marketplace connecting clients with a
  worldwide network of freelance designers for logos, brand identity, web and
  packaging design, illustration, and more, using both a design-contest model
  and one-to-one projects. Its partner API (base https://api.99designs.com/resources/v1)
  lets platforms embed a fully-managed creative marketplace: search and match
  designers, retrieve designer profiles, reviews and portfolios, collect design
  briefs, list the products a partner has available for sale, place orders
  against those product versions, and generate partner coupons.
  Authentication uses a pair of API key headers (Api-Key-Id and Api-Key-Secret)
  issued to partners on request — access is sales-gated rather than self-serve,
  and no API plans or pricing are published. Founded in 2008 as a SitePoint
  spin-off and acquired by Cimpress/Vista in 2020.
